<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金小存 · 进销存</title>
<script src="./vendor/echarts.min.js"></script>
<style>
  :root{
    /* porcelain（青瓷蓝）· 单色相蓝阶：明度即数据，色相恒定
       BG/TXT/DATA 取自 lieflat-charts color-presets.js 的 PORCELAIN */
    --bg:#EEF2F9;
    --panel:#FFFFFF;
    --panel-2:#F4F7FC;
    --border:rgba(8,31,92,.13);
    --border-soft:rgba(8,31,92,.07);
    --text:#0A1F4D;
    --muted:rgba(8,31,92,.62);
    --faint:rgba(8,31,92,.40);
    --accent:#334EAC;              /* 主蓝 */
    --accent-2:#081F5C;            /* 藏青 */
    --accent-soft:rgba(51,78,172,.10);
    --red:#C8371B;
    --red-soft:rgba(200,55,27,.09);
    --yellow:#9C6410;
    --yellow-soft:rgba(156,100,16,.11);
    --green:#2C6E48;
    --green-soft:rgba(44,110,72,.09);
    --radius:18px;
    --shadow:0 2px 10px rgba(8,31,92,.07);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;min-height:100vh}

  /* ---------- 侧边导航 ---------- */
  .sidebar{
    width:220px;flex:0 0 220px;position:fixed;top:0;bottom:0;left:0;z-index:20;
    background:#081F5C;border-right:none;
    display:flex;flex-direction:column;padding:20px 14px 16px;
  }
  .brand{display:flex;align-items:center;gap:11px;padding:2px 6px 20px}
  .brand-logo{
    width:40px;height:40px;border-radius:12px;flex:0 0 40px;
    background:#FFFFFF;
    display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:800;color:#081F5C;
  }
  .brand-name{font-size:17px;font-weight:700;letter-spacing:1px;color:#FFFFFF}
  .brand-sub{font-size:11px;color:rgba(255,255,255,.55);margin-top:2px;letter-spacing:1px}
  .nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .nav-item{
    display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;
    background:none;border:none;border-radius:10px;cursor:pointer;
    color:rgba(255,255,255,.66);font-size:14px;font-weight:500;text-align:left;
    transition:background .15s,color .15s;
  }
  .nav-item svg{width:19px;height:19px;flex:0 0 19px}
  .nav-item:hover{background:rgba(255,255,255,.09);color:#FFFFFF}
  .nav-item.active{background:rgba(255,255,255,.16);color:#FFFFFF;font-weight:600}
  .sidebar-foot{margin-top:auto;padding:12px 8px 2px;font-size:12px;color:rgba(255,255,255,.45);display:flex;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex:0 0 8px}

  /* ---------- 主区 ---------- */
  .main{margin-left:220px;flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:16px 26px;background:rgba(240,240,238,.88);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);flex-wrap:wrap;
  }
  .topbar-left{display:flex;align-items:center;gap:14px;min-width:0}
  .topbar h1{font-size:20px;font-weight:700;letter-spacing:.5px}
  .station-chip{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(245,87,47,.28);
    padding:4px 11px;border-radius:20px;white-space:nowrap;
  }
  .topbar-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .filter-label{font-size:13px;color:var(--muted)}
  select#stationSelect{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:9px;padding:8px 12px;font-size:13px;min-width:190px;max-width:260px;
    outline:none;cursor:pointer;
  }
  select#stationSelect:focus{border-color:var(--accent)}
  .updated{font-size:12px;color:var(--faint)}
  .updated b{color:var(--muted);font-weight:600}

  /* ---------- 移动端顶部 tab ---------- */
  .mobile-tabs{
    display:none;position:sticky;top:0;z-index:9;gap:6px;padding:10px 14px;
    background:rgba(240,240,238,.94);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);overflow-x:auto;
  }
  .mobile-tab{
    flex:0 0 auto;padding:8px 16px;border-radius:20px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--muted);font-size:13px;cursor:pointer;white-space:nowrap;
  }
  .mobile-tab.active{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}

  .content{padding:22px 26px 40px;flex:1}
  .panel{display:none;animation:fadein .25s ease}
  .panel.active{display:block}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .status-banner{
    display:none;margin:0 26px;padding:10px 14px;border-radius:10px;font-size:13px;
    background:var(--yellow-soft);color:var(--yellow);border:1px solid rgba(156,100,16,.24);
  }
  .status-banner.error{background:var(--red-soft);color:var(--red);border-color:rgba(200,55,27,.24)}

  /* ---------- KPI 大数字卡 ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
  .kpi-grid-3{grid-template-columns:repeat(3,1fr)}
  .kpi-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:24px 24px 20px;position:relative;overflow:hidden;
  }
  .kpi-card::after{
    content:"";position:absolute;left:0;top:0;width:100%;height:3px;
    background:var(--text);
  }
  .kpi-card.danger::after{background:var(--red)}
  .kpi-card.warn::after{background:var(--yellow)}
  .kpi-label{font-size:13px;color:var(--muted);margin-bottom:10px}
  .kpi-value{font-size:30px;font-weight:750;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.1}
  .kpi-value .unit{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
  .kpi-card.danger .kpi-value{color:var(--red)}
  .kpi-card.warn .kpi-value{color:var(--yellow)}
  .kpi-sub{font-size:12px;color:var(--faint);margin-top:8px}

  /* ---------- 卡片 / 网格 ---------- */
  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:22px 24px 16px;margin-bottom:20px;
  }
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .card-head h3{font-size:15px;font-weight:650;letter-spacing:.3px}
  .card-head .muted{font-size:12px}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;align-items:start}
  .grid-2>.card{margin-bottom:0}
  .chart{width:100%;height:300px}
  .chart-h{height:340px}
  .empty-chart{height:100%;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px}

  /* ---------- 表格 ---------- */
  .table-wrap{overflow:auto;margin:2px 0 6px;max-height:460px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:10px 12px;color:var(--muted);font-weight:600;font-size:12px;border-bottom:1px solid var(--border);white-space:nowrap}
  th.num{text-align:right;font-variant-numeric:tabular-nums}
  td{padding:10px 12px;border-bottom:1px solid var(--border-soft);color:var(--text);white-space:nowrap}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:rgba(31,30,28,.035)}
  tr.clickable{cursor:pointer}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  td.td-name{max-width:320px;overflow:hidden;text-overflow:ellipsis}
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:12px;color:var(--muted)}
  .num.neg{color:var(--red);font-weight:600}
  .num.warn{color:var(--yellow)}
  .num.pos{color:var(--green)}

  /* ---------- 标签 chip ---------- */
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid}
  .chip-red{color:var(--red);background:var(--red-soft);border-color:rgba(200,55,27,.24)}
  .chip-yellow{color:var(--yellow);background:var(--yellow-soft);border-color:rgba(156,100,16,.24)}
  .chip-green{color:var(--green);background:var(--green-soft);border-color:rgba(44,110,72,.24)}
  .chip-muted{color:var(--muted);background:rgba(31,30,28,.055);border-color:var(--border)}
  .chip-accent{color:var(--accent);background:var(--accent-soft);border-color:rgba(245,87,47,.28)}

  .empty{padding:26px;text-align:center;color:var(--faint);font-size:13px}
  .muted{color:var(--muted)}
  .accent{color:var(--accent)}

  /* ---------- 按钮 ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:999px;
    background:var(--text);color:var(--bg);border:none;cursor:pointer;
    font-size:14px;font-weight:600;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);box-shadow:none;font-weight:500}

  .import-card p{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:14px;max-width:640px}
  .seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px}
  .seg-btn{padding:6px 14px;border:none;background:none;color:var(--muted);font-size:13px;border-radius:7px;cursor:pointer;white-space:nowrap}
  .seg-btn.active{background:var(--text);color:var(--bg);font-weight:600}
  .import-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .import-filename{font-size:13px;color:var(--muted);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .import-result{font-size:13px;margin-bottom:10px;min-height:18px}
  .import-result-ok{color:var(--text)}
  .import-result-err{color:var(--red)}
  .import-status{margin-top:14px;font-size:12px;color:var(--faint);line-height:1.7;border-top:1px solid var(--border-soft);padding-top:10px}

  /* ---------- 盘点账式 ---------- */
  .eq-card{padding:22px 20px 14px}
  .eq{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .eq-item{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:14px 18px;min-width:120px;flex:1}
  .eq-label{font-size:12px;color:var(--muted);margin-bottom:6px}
  .eq-val{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums}
  .eq-op{font-size:22px;color:var(--faint);font-weight:600}
  .eq-2{margin-top:14px}
  .eq-foot{font-size:12px;color:var(--faint);margin-top:16px;line-height:1.7}

  .drill-bar{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .drill-bar h2{font-size:19px;font-weight:700}

  /* ---------- 响应式 ---------- */
  @media(max-width:1180px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:900px){
    .sidebar{display:none}
    .mobile-tabs{display:flex}
    .main{margin-left:0}
    .grid-2{grid-template-columns:1fr}
    .content{padding:16px 14px 34px}
    .topbar{padding:12px 14px}
    select#stationSelect{min-width:150px}
  }
  @media(max-width:640px){
    .kpi-grid,.kpi-grid-3{grid-template-columns:1fr}
    .kpi-value{font-size:26px}
    .topbar h1{font-size:17px}
  }
  /* ---------- 口令锁定遮罩（静态口令保护看板）---------- */
  .lock-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(240,240,238,.96);backdrop-filter:blur(6px)}
  .lock-box{width:340px;max-width:90vw;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;text-align:center;box-shadow:var(--shadow)}
  .lock-logo{width:48px;height:48px;border-radius:12px;background:var(--accent);color:#fff;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .lock-box h2{font-size:18px;margin-bottom:6px}
  .lock-box .muted{color:var(--muted);font-size:13px;margin-bottom:18px}
  /* 口令已取消，原 #passInput 样式已移除 */
  #passBtn{width:100%;padding:12px;border:none;border-radius:999px;background:var(--text);color:var(--bg);font-size:15px;font-weight:600;cursor:pointer}
  .lock-err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}
  .lock-hint{color:var(--faint);font-size:11px;margin-top:14px;line-height:1.5}
  .readonly .import-only{display:none!important}
  .sync-btn{margin-top:8px;width:100%;padding:8px;border:1px solid rgba(255,255,255,.22);border-radius:8px;background:transparent;color:rgba(255,255,255,.62);font-size:12px;cursor:pointer}
  .sync-btn:hover{color:#FFFFFF;border-color:rgba(255,255,255,.5)}
</style>
</head>
<body>
<!-- 口令已于 2026-10-16 取消。此浮层默认隐藏，仅在数据加载失败时用于提示。 -->
<div id="lock" class="lock-overlay" style="display:none">
  <div class="lock-box">
    <div class="lock-logo">金</div>
    <h2>数据加载失败</h2>
    <p class="muted">看板数据暂时取不到，请稍后重试</p>
    <button id="passBtn" class="btn" onclick="location.reload()">重新加载</button>
    <div id="passErr" class="lock-err"></div>
    <p class="lock-hint">多为 GitHub Actions 正在同步或网络异常，等 10 分钟后刷新即可。</p>
  </div>
</div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">金</div>
      <div>
        <div class="brand-name">金小存</div>
        <div class="brand-sub">进销存管理</div>
      </div>
    </div>
    <nav class="nav">
      <button id="nav-overview" class="nav-item active" onclick="setTab('overview')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        总览
      </button>
      <button id="nav-purchase" class="nav-item" onclick="setTab('purchase')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M3 17v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2"/></svg>
        进货
      </button>
      <button id="nav-sales" class="nav-item" onclick="setTab('sales')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="M7 14l5-5 5 5"/><path d="M3 17v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2"/></svg>
        销售
      </button>
      <button id="nav-inventory" class="nav-item" onclick="setTab('inventory')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>
        库存
      </button>
      <button id="nav-reconcile" class="nav-item" onclick="setTab('reconcile')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5V3h6v1.5"/><path d="M9 12l2 2 4-4"/></svg>
        盘点
      </button>
    </nav>
    <div class="sidebar-foot"><span class="dot"></span>数据每 15 分钟自动刷新</div>
    <button id="syncBtn" class="sync-btn">立即同步（需令牌）</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 id="pageTitle">总览</h1>
        <span id="stationChip" class="station-chip">全部油站</span>
      </div>
      <div class="topbar-right">
        <label class="filter-label" for="stationSelect">油站</label>
        <select id="stationSelect" onchange="setStation(this.value)"></select>
        <span class="updated">更新于 <b id="updatedAt">-</b></span>
      </div>
    </header>

    <nav class="mobile-tabs">
      <button id="mtab-overview" class="mobile-tab active" onclick="setTab('overview')">总览</button>
      <button id="mtab-purchase" class="mobile-tab" onclick="setTab('purchase')">进货</button>
      <button id="mtab-sales" class="mobile-tab" onclick="setTab('sales')">销售</button>
      <button id="mtab-inventory" class="mobile-tab" onclick="setTab('inventory')">库存</button>
      <button id="mtab-reconcile" class="mobile-tab" onclick="setTab('reconcile')">盘点</button>
    </nav>

    <div id="statusBanner" class="status-banner"></div>

    <section class="content">
      <section id="panel-overview" class="panel active"></section>
      <section id="panel-purchase" class="panel" style="display:none"></section>
      <section id="panel-sales" class="panel" style="display:none"></section>
      <section id="panel-inventory" class="panel" style="display:none"></section>
      <section id="panel-reconcile" class="panel" style="display:none"></section>
    </section>
  </main>
</div>

<script>
(function(){
'use strict';

var M = null;
var currentTab = 'overview';
var currentStation = '__ALL__';
var charts = {};
var importKind = 'orders';   // orders | jituan
var importFile = null;       // 选中的 File 对象
var importing = false;
var importState = null;      // GET /api/import-state 结果
var importResultHtml = null; // 最近一次导入结果（跨重绘保留）

/* 静态口令保护看板配置 */
var READONLY = true;            // 只读看板先行：隐藏导入 UI、不调用导入接口
var currentPass = '';           // 兼容占位（口令已于 2026-10-16 取消，不再使用）
var GH_REPO = 'lvritiann/jinxiaocun-cockpit'; // 建好仓库后填 owner/repo，供「同步」按钮触发 Actions

var TAB_TITLES = { overview:'总览', purchase:'进货', sales:'销售', inventory:'库存', reconcile:'盘点' };
var PANELS = ['overview','purchase','sales','inventory','reconcile'];

var nf0 = new Intl.NumberFormat('zh-CN');
function money(v){
  var n = Math.round(Number(v)||0);
  return (n<0?'-':'') + '¥' + nf0.format(Math.abs(n));
}
function num(v){ return nf0.format(Math.round(Number(v)||0)); }
function fmtShort(v){
  var n = Math.round(Number(v)||0);
  var a = Math.abs(n);
  if(a>=100000000) return (n/100000000).toFixed(1)+'亿';
  if(a>=10000) return (n/10000).toFixed(1)+'万';
  return String(n);
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function el(id){ return document.getElementById(id); }
function emptyDiv(msg){ return '<div class="empty">'+msg+'</div>'; }
function table(heads, rowsHtml){
  // 表头对齐必须跟数据列走：数字列 (td.num) 右对齐，表头也要右对齐，
  // 否则 th 全局左对齐、td.num 右对齐 → 表头与数字左右错位（2026-10-20 修复）
  var firstRow = (String(rowsHtml).match(/<tr[\s\S]*?<\/tr>/) || [''])[0];
  var tds = firstRow.match(/<td[^>]*>/g) || [];
  var ths = heads.map(function(h, i){
    var isNum = tds[i] && /class="[^"]*\bnum\b/.test(tds[i]);
    return '<th' + (isNum ? ' class="num"' : '') + '>' + h + '</th>';
  }).join('');
  return '<div class="table-wrap"><table><thead><tr>' + ths
    + '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>';
}
function kpiCard(label, value, sub, tone){
  return '<div class="kpi-card'+(tone?' '+tone:'')+'">'
    + '<div class="kpi-label">'+label+'</div>'
    + '<div class="kpi-value">'+value+'</div>'
    + '<div class="kpi-sub">'+sub+'</div></div>';
}

function isAll(){ return currentStation === '__ALL__'; }
function stationList(){ return (M && M.dynByStation || []).map(function(s){return s.station;}); }
function filterStation(arr){

/* ---------- ECharts 封装 ---------- */
// 渐变助手：echarts 未就绪或 graphic 缺失时退回纯色，避免整页渲染崩掉
function grad(c1, c2){
  try{
    if(typeof echarts!=='undefined' && echarts.graphic && echarts.graphic.LinearGradient)
      return new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:c1},{offset:1,color:c2}]);
  }catch(_){}
  return c1;
}
function setChart(id, opt){
  // ⚠️ 单个图表失败绝不能冒泡到 render()，否则整页空白——这里吞掉异常并在容器里留提示
  try{
    if(typeof echarts==='undefined'){ var n0=el(id); if(n0) n0.innerHTML='<div class="empty-chart">图表库未加载</div>'; return; }
    var node = el(id);
    if(!node) return;
    if(charts[id]){ if(charts[id].dispose) charts[id].dispose(); charts[id]=null; }
    charts[id] = echarts.init(node);
    charts[id].setOption(opt, {notMerge:true});
  }catch(err){
    console.error('[金小存] 图表 '+id+' 渲染失败', err);
    try{ var n=el(id); if(n) n.innerHTML='<div class="empty-chart">图表渲染失败</div>'; }catch(_){}
  }
}
/* ---------- porcelain 图表调色（lieflat-charts · 单色相蓝阶） ---------- */
var PB = {
  deep:'#081F5C', main:'#334EAC', mid:'#7096D1', soft:'#BAD6EB', pale:'#D0E3FF',
  ramp:['#081F5C','#334EAC','#7096D1','#BAD6EB','#D0E3FF'],
  ser:['#334EAC','#081F5C','#7096D1','#BAD6EB','#D0E3FF']
};
var AXIS_LABEL = {color:'rgba(8,31,92,.62)',fontSize:12};
var CAT_LABEL = {color:'#0A1F4D',fontSize:12,fontWeight:600};
var SPLIT = {lineStyle:{color:'rgba(8,31,92,.10)',type:'dashed'}};
var AXIS_LINE = {lineStyle:{color:'rgba(8,31,92,.22)'}};
/* 线性渐变：echarts.graphic 缺失时自动退回最后一色，绝不抛错（图表容错第一原则） */
function pgrad(dir, colors){
  try{
    if(typeof echarts==='undefined' || !echarts.graphic || !echarts.graphic.LinearGradient){
      return colors[colors.length-1];
    }
    var stops = colors.map(function(c,i){ return {offset: colors.length===1?0:i/(colors.length-1), color:c}; });
    var xy = dir==='v' ? [0,1,0,0] : (dir==='h' ? [0,0,1,0] : [0,0,0,1]);
    return new echarts.graphic.LinearGradient(xy[0],xy[1],xy[2],xy[3],stops);
  }catch(e){ return colors[colors.length-1]; }
}
/* 通栏柱的标准渐变（底深顶亮，柱头像受光） */
var GBAR_H = function(){ return pgrad('h',['#1E2F78','#6F92D8']); };
var GBAR_V = function(){ return pgrad('v',['#1E2F78','#6F92D8']); };
/* 数值标签统一样式 */
function valLabel(opt){
  opt = opt || {};
  return {show:true,position:opt.position||'right',color:opt.color||'#0A1F4D',
    fontSize:opt.fontSize||11,fontWeight:600,
    formatter:opt.formatter||function(p){return num(p.value);}};
}

function renderFlowChart(){

function reorderList(){
  var low = filterStation(M.dynLow||[]).map(function(x){return Object.assign({},x,{kind:'缺货'});});
  var warn = filterStation(M.dynWarn||[]).map(function(x){return Object.assign({},x,{kind:'低量'});});
  return low.concat(warn).sort(function(a,b){return a.qty-b.qty;}).slice(0,300);
}
function renderReorderTable(list){
  if(!list.length) return emptyDiv('暂无缺货 / 低量预警');

/* ---------- 订货台账导入（真实接口） ---------- */
function setImportKind(k){
  importKind = (k==='jituan') ? 'jituan' : 'orders';
  var b1 = el('importKindOrders'), b2 = el('importKindJituan');
  if(b1) b1.className = 'seg-btn'+(importKind==='orders'?' active':'');
  if(b2) b2.className = 'seg-btn'+(importKind==='jituan'?' active':'');
}
function onImportFile(input){
  importFile = (input && input.files && input.files[0]) ? input.files[0] : null;
  importResultHtml = null;
  var box = el('importResult'); if(box) box.innerHTML = '';
  renderImportControls();
}
function renderImportResultBox(){
  var box = el('importResult');
  if(box) box.innerHTML = importResultHtml || '';
}
function showImportResult(html){
  importResultHtml = html;
  renderImportResultBox();
}
function renderImportControls(){
  var fn = el('importFileName');
  if(fn) fn.textContent = importFile ? importFile.name : '未选择文件';
  var btn = el('importSubmit');
  if(btn){
    if(importing){ btn.disabled = true; btn.textContent = '导入中…'; }
    else { btn.disabled = !importFile; btn.textContent = '立即导入'; }
  }
}
function renderImportState(){
  var box = el('importStateBox'); if(!box) return;
  if(!importState || !importState.lastRun){
    box.innerHTML = '<span class="muted">上次导入：暂无记录</span>';
    return;
  }
  box.innerHTML = '上次导入 '+esc(importState.lastRun)
    + ' · 导入 '+num(importState.imported)+' · 跳过 '+num(importState.skipped)
    + ' · 未匹配 '+num(importState.unmatched);
}
function renderImportResult(j){
  showImportResult('<div class="import-result-ok"><span class="chip chip-green">导入成功</span>'
    + ' 导入 '+num(j.imported)+' · 跳过 '+num(j.skipped)+' · 未匹配 '+num(j.unmatched)+'</div>');
}
function renderImportError(msg){
  showImportResult('<div class="import-result-err">'+esc(msg)+'</div>');
}
async function doImport(){
  if(!importFile || importing) return;
  importing = true;
  renderImportControls();
  var box = el('importResult');
  if(box) box.innerHTML = '<div class="muted">正在导入…</div>';
  try{
    var resp = await fetch('/api/import?kind='+importKind, {method:'POST', body: importFile});
    var j = await resp.json();
    if(j && j.ok){
      renderImportResult(j);
      importFile = null;
      var fi = el('importFile'); if(fi && fi.value!==undefined) fi.value = '';
      loadImportState();
      load();
    } else {
      renderImportError((j && j.error) || '导入失败');
    }
  }catch(e){
    renderImportError('导入请求失败：'+(e&&e.message||e));
  } finally {
    importing = false;
    renderImportControls();
  }
}
async function loadImportState(){
  try{
    var resp = await fetch('/api/import-state');
    var j = await resp.json();
    importState = (j && typeof j==='object' && j.lastRun) ? j : null;
  }catch(e){
    importState = null;
  }
  renderImportState();
}

}
function mergeLedgerItems(){
  var out = [];
  var map = M.ledgerByStation||{};
  Object.keys(map).forEach(function(st){ (map[st]||[]).forEach(function(it){ out.push(Object.assign({station:st},it)); }); });
  return out.sort(function(a,b){return Math.abs(b.diff)-Math.abs(a.diff);}).slice(0,300);
}
function chipForType(t){
  if(t==='盘亏') return 'chip-red';
  if(t==='期末未扣销售') return 'chip-yellow';
  if(t==='盘点缺失') return 'chip-muted';
  return 'chip';
}
function renderLedgerTable(led){
  if(!led.length) return emptyDiv('暂无进销存账');
  var trs = led.map(function(r){
    return '<tr class="clickable" onclick="setStation(\''+esc(r.station)+'\')">'
      + '<td>'+esc(r.station)+'</td><td class="num">'+num(r.open)+'</td><td class="num">'+num(r.purchase)+'</td>'
      + '<td class="num">'+num(r.sold)+'</td><td class="num">'+num(r.theo)+'</td><td class="num">'+num(r.actual)+'</td>'
      + '<td class="num '+(r.diff<0?'neg':(r.diff>0?'pos':''))+'">'+(r.diff>0?'+':'')+num(r.diff)+'</td></tr>';
  }).join('');
  return table(['站点','期初','进货','销售','理论','实盘','差异'], trs);
}
function renderLedgerItemsTable(items){
  if(!items.length) return emptyDiv('暂无差异明细');
  var trs = items.map(function(x){
    return '<tr><td>'+esc(x.station)+'</td><td class="td-name" title="'+esc(x.name)+'">'+esc(x.name)+'</td>'
      + '<td class="mono">'+esc(x.bar)+'</td><td><span class="chip '+chipForType(x.type)+'">'+esc(x.type)+'</span></td>'
      + '<td class="num">'+num(x.open)+'</td><td class="num">'+num(x.purchase)+'</td><td class="num">'+num(x.sold)+'</td>'
      + '<td class="num">'+num(x.actual)+'</td>'
      + '<td class="num '+(x.diff<0?'neg':(x.diff>0?'pos':''))+'">'+(x.diff>0?'+':'')+num(x.diff)+'</td></tr>';
  }).join('');
  return table(['站点','商品','条码','类型','期初','进货','销售','实盘','差异'], trs);
}
function renderDiffTypeChart(){
  var dt = M.diffType||{};
  var colorMap = {'账实相符':PB.soft,'盘亏':'#C8371B','期末未扣销售':PB.mid,'盘点缺失':PB.main};
  var data = Object.keys(dt).map(function(k){return {name:k,value:dt[k],itemStyle:{color:colorMap[k]||PB.main}};});
  var node = el('chartDiffType');
  if(!data.length){ if(node) node.innerHTML='<div class="empty-chart">暂无差异数据</div>'; return; }
  var dtTotal = Object.keys(dt).reduce(function(s,k){ return s + (Number(dt[k])||0); }, 0);
  setChart('chartDiffType', {
    tooltip:{trigger:'item'},
    title:{text:nf0.format(dtTotal),subtext:'盘点行数',left:'50%',top:'30%',textAlign:'center',
      textStyle:{fontSize:24,fontWeight:700,color:'#081F5C',fontFamily:'inherit',lineHeight:28},
      subtextStyle:{fontSize:11,color:'rgba(8,31,92,.55)'}},
    legend:{bottom:0,textStyle:AXIS_LABEL,itemWidth:12,itemHeight:8},
    series:[{type:'pie',radius:['60%','78%'],center:['50%','43%'],padAngle:2,
      itemStyle:{borderRadius:6,borderColor:'#FFFFFF',borderWidth:2},
      label:{color:'#0A1F4D',fontSize:12,fontWeight:600,
        formatter:function(p){ return p.percent>=4 ? p.name+'  '+p.percent.toFixed(1)+'%' : ''; }},
      labelLine:{show:true,length:10,length2:14,lineStyle:{color:'rgba(8,31,92,.30)'}},data:data}]
  });
}

/* ============================================================
 * 面板调度 / 状态
 * ========================================================== */
function showPanel(tab){
  // ⚠️ 必须同时切换 active 类：CSS 是 `.panel{display:none}` / `.panel.active{display:block}`。
  // 早期只写 node.style.display='' 是「移除内联样式」，会回落到 .panel{display:none}，
  // 结果除初始带 active 的总览外，其它页签点开后整页空白（2026-10-20 修复）。
  PANELS.forEach(function(t){
    var node = el('panel-'+t);
    if(!node) return;
    if(t===tab){ node.className = 'panel active'; node.style.display = ''; }
    else { node.className = 'panel'; node.style.display = 'none'; }
  });
}
function renderPanel(tab){
  showPanel(tab);
  if(!M) return;
  // ⚠️ 每个页签单独兜底：某一页渲染异常不能拖垮其余页签（否则表现为"全部没数据"）
  try{
    if(tab==='overview') renderOverview();
    else if(tab==='purchase') renderPurchase();
    else if(tab==='sales') renderSales();
    else if(tab==='inventory') renderInventory();
    else if(tab==='reconcile') renderReconcile();
  }catch(err){
    console.error('[金小存] 页签 '+tab+' 渲染失败', err);
    try{
      var p=el('panel-'+tab);
      if(p) p.innerHTML='<div class="card"><div class="empty">该页渲染出错：'+esc(err&&err.message||err)+'</div></div>';
    }catch(_){}
  }
}
function updateHeader(){
  var t = el('pageTitle'); if(t) t.textContent = TAB_TITLES[currentTab]||'总览';
  var u = el('updatedAt');
  if(u) u.textContent = (M&&M.generatedAt) ? formatTime(M.generatedAt) : '-';
  var sc = el('stationChip');
  if(sc) sc.textContent = isAll() ? '全部油站' : currentStation;
}
function formatTime(iso){
  try{ var d = new Date(iso); return d.toLocaleString('zh-CN',{hour12:false}); }
  catch(e){ return String(iso); }
}
function populateStationSelect(){
  var sel = el('stationSelect'); if(!sel) return;
  var list = stationList();
  var cur = isAll() ? '__ALL__' : (list.indexOf(currentStation)>=0 ? currentStation : '__ALL__');
  var html = '<option value="__ALL__">全部油站（'+list.length+'）</option>';
  html += list.map(function(s){return '<option value="'+esc(s)+'"'+(s===cur?' selected':'')+'>'+esc(s)+'</option>';}).join('');
  sel.innerHTML = html;
  currentStation = cur;
}
function showStatus(msg, isError){
  var node = el('statusBanner'); if(!node) return;
  node.textContent = msg||'';
  node.style.display = msg ? '' : 'none';
  node.className = 'status-banner'+(isError?' error':'');
}

function setTab(tab){
  if(!TAB_TITLES[tab]) tab = 'overview';
  currentTab = tab;
  PANELS.forEach(function(t){
    var b1 = el('nav-'+t); if(b1) b1.className = (t===tab)?'nav-item active':'nav-item';
    var b2 = el('mtab-'+t); if(b2) b2.className = (t===tab)?'mobile-tab active':'mobile-tab';
  });
  updateHeader();
  renderPanel(tab);
}
function setStation(st){
  currentStation = st || '__ALL__';
  populateStationSelect();
  updateHeader();
  renderPanel(currentTab);
}
function render(){
  if(!M) return;
  populateStationSelect();
  updateHeader();
  renderPanel(currentTab);
}

/* ---------- 无口令模式（2026-10-16 起）：直接拉取明文 metrics.json ---------- */
function fmtTime(iso){ try{ return new Date(iso).toLocaleString('zh-CN',{hour12:false}); }catch(_){ return ''; } }
function showError(msg){
  var lock=document.getElementById('lock'); if(lock) lock.style.display='flex';
  var pe=document.getElementById('passErr'); if(pe) pe.textContent=msg||'';
}
async function refreshData(){
  try{
    var res = await fetch('./metrics.json?_=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    var txt = await res.text();
    var data;
    try{ data = JSON.parse(txt); }
    catch(_){
      // 兼容期：若线上仍是加密产物，给一句明确提示（而不是含糊的"加载失败"）
      throw new Error('metrics.json 不是明文（可能仍是加密版本），请触发一次同步重新生成');
    }
    M = data;
    var lock=document.getElementById('lock'); if(lock) lock.style.display='none';
    render();
    if(!READONLY) loadImportState();
    var s=document.getElementById('syncState'); if(s && data.generatedAt) s.textContent='数据时间 '+fmtTime(data.generatedAt);
  }catch(e){
    console.error('[金小存] 加载失败', e);
    showError('加载失败：'+(e&&e.message||e));
  }
}
async function syncNow(){
  var pat=null; try{ pat=localStorage.getItem('jxc_pat'); }catch(_){}
  if(!pat){
    var input=prompt('请输入 fine-grained PAT（仅 Actions:read/write）：');
    if(!input) return;
    pat=input.trim(); try{ localStorage.setItem('jxc_pat', pat); }catch(_){}
  }
  showStatus('正在触发同步…', false);
  try{
    var r=await fetch('https://api.github.com/repos/'+GH_REPO+'/actions/workflows/sync.yml/dispatches',{
      method:'POST',
      headers:{'Authorization':'Bearer '+pat,'Content-Type':'application/json','Accept':'application/vnd.github+json'},
      body: JSON.stringify({ref:'main'})
    });
    if(r.status===204) showStatus('已触发同步，约 20–40 秒后自动刷新', false);
    else showStatus('同步触发失败：HTTP '+r.status, true);
  }catch(e){ showStatus('同步请求失败：'+(e&&e.message||e), true); }
}

/* 暴露给测试 / 控制台 */
globalThis.setTab = setTab;
globalThis.setStation = setStation;
globalThis.setImportKind = setImportKind;
globalThis.onImportFile = onImportFile;
globalThis.doImport = doImport;
globalThis.setImportFile = function(fileObj){ importFile = fileObj || null; renderImportControls(); };
globalThis.getMetrics = function(){ return M; };
globalThis.getImportState = function(){ return importState; };
globalThis.getState = function(){ return {tab:currentTab, station:currentStation, importKind:importKind}; };

/* 启动：直接加载明文数据（口令已于 2026-10-16 取消） */
document.body.classList.toggle('readonly', READONLY);
var syncBtn=document.getElementById('syncBtn');
if(syncBtn) syncBtn.onclick=syncNow;
render(); // 先画空壳（M 为空时 render早退）
refreshData();                       // ← 打开即取数，无需任何口令
if(!READONLY){ loadImportState(); setInterval(loadImportState, 60000); }
setInterval(refreshData, 900000); // 15 分钟自动刷新

})();
