name: 金小存 · 同步看板 (relay → Pages)

# 触发：① 每 15 分钟自动同步一次；② 网页「立即同步」按钮手动触发 workflow_dispatch
on:
  schedule:
    - cron: '*/15 * * * *'          # UTC，约每 15 分钟；GitHub 高负载时可能延迟数分钟
  workflow_dispatch: {}              # 允许手动触发（看板的「立即同步」按钮）

# 部署 GitHub Pages 所需权限（仅读代码 + 写 Pages，绝不把 token 写进仓库）
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个同步，避免并发重复拉金山
concurrency:
  group: jinxiaocun-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行中继（拉金山多维表 → 产出 site/）
        env:
          KDOCS_TOKEN: ${{ secrets.KDOCS_TOKEN }}   # 金山 WPS access token（仓库 Secrets，不入库）
          RELAY_PLAINTEXT: '1'                       # 明文发布（看板口令已于 2026-10-16 取消）
          # 如需恢复口令保护：把上一行改成 '0'，并配置 RELAY_PASS secret
          RELAY_PASS:   ${{ secrets.RELAY_PASS }}     # 仅加密模式使用
        run: node relay.js

      - name: 校验产出
        run: |
          if [ ! -s site/metrics.json ]; then
            echo "❌ site/metrics.json 为空，中继可能失败"; exit 1
          fi
          head -c 1 site/metrics.json | grep -q '{' || { echo "❌ metrics.json 不是明文 JSON"; exit 1; }
          echo "✅ metrics.json 大小: $(wc -c < site/metrics.json) 字节（明文，无口令）"

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site                                   # 含 index.html / metrics.json(明文) / vendor/echarts.min.js

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
